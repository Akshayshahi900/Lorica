services:
  postgres:
    image: postgres:16
    container_name: lorica-psql
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lorica-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
  
  neo4j:
    image: neo4j:5
    container_name: lorica-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt

    environment:
      NEO4J_AUTH: neo4j/password123

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins

volumes:
  pgdata:
  redis-data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
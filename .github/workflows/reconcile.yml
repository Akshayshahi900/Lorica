name: Reconcile reviews

# Backstop for the case where nothing wakes the API: GitHub does not retry
# failed webhooks, so this asks the API to redeliver them and to wake the
# worker for any review still owed. Each run wakes the free-tier API briefly.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reconciliation
        env:
          LORICA_API_URL: ${{ secrets.LORICA_API_URL }}
          LORICA_API_TOKEN: ${{ secrets.LORICA_API_TOKEN }}
        run: |
          # A cold start can take a minute, so allow retries and a long timeout.
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST \
            -H "x-lorica-api-token: ${LORICA_API_TOKEN}" \
            "${LORICA_API_URL%/}/api/internal/reconcile"

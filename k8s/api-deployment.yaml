apiVersion: apps/v1
kind: Deployment

metadata:
  name: lorica-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: lorica-api

  template:
    metadata:
      labels:
        app: lorica-api

    spec:
      containers:
        - name: api
          image: shahiakshay900/lorica-api:latest
          ports:
            - containerPort: 5000